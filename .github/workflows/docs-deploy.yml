name: Publish documentation

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Hatch
        uses: pypa/hatch@install

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      # Build the docs on PRs
      - name: Verify Docs Build (on Pull Requests)
        if: github.event_name == 'pull_request'
        run: hatch run docs:mkdocs build --strict

      # Deploy Dev Documentation (on main)
      - name: Deploy Dev Documentation (on main)
        if: github.ref == 'refs/heads/main'
        run: hatch run docs:mike deploy dev --push

      # Deploy Release Documentation (on tags)
      - name: Deploy Release Documentation (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: hatch run docs:mike deploy ${{ github.ref_name }} latest --update-aliases --push