name: Publish Documentation

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install Hatch
        uses: pypa/hatch@install

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v5
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-

      # Test build docs on PRs
      - name: Verify Docs Build (on Pull Requests)
        if: github.event_name == 'pull_request'
        run: hatch run docs:build

      # Deploy dev documentation (skip bot commits to avoid possible race conditions with changelog CI)
      - name: Deploy Branch Documentation
        if: >
          github.event_name == 'push' &&
          !startsWith(github.ref, 'refs/tags/') &&
          github.actor != 'github-actions[bot]'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: hatch run docs:deploy "$REF_NAME"

      # Deploy release documentation (tag push OR explicitly dispatched by changelog CI)
      - name: Deploy Release Documentation
        if: >
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: hatch run docs:deploy "$REF_NAME" latest