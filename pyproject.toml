[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pytvpaint"
dynamic = ["version"]
description = "Python scripting for TVPaint"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Brunch Studio Developers", email = "dev@brunchstudio.tv" },
    { name = "Radouane Lahmidi", email = "rlahmidi@brunchstudio.tv" },
    { name = "Joseph Henry", email = "jhenry@brunchstudio.tv" },
]
keywords = ["tvpaint", "brunch", "tvp", "george"]
dependencies = [
    "websocket-client>=1.7.0",
    "typing-extensions>=4.9.0",
    "fileseq>=2.0.0",
    "packaging>=22.0",
]

[project.urls]
Repository = "https://github.com/brunchstudio/pytvpaint"
Documentation = "https://brunchstudio.github.io/pytvpaint/"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pytvpaint/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "ruff>=0.2.2",
    "mypy>=1.9.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=4.0.0",
]
docs = [
    "zensical",
    "mkdocstrings[python]>=0.24.0",
    "mike",
]

[tool.hatch.envs.default]
features = ["dev", "test"]

[tool.hatch.envs.dev]
features = ["dev"]

[tool.hatch.envs.dev.scripts]
format = "black ."
lint = "ruff check --fix ."
typecheck = "mypy ."
all = ["format", "lint", "typecheck"]

[tool.hatch.envs.test]
features = ["test"]

[tool.hatch.envs.docs]
features = ["docs"]

[tool.hatch.envs.docs.scripts]
build = "zensical build"
serve = "zensical serve"
deploy-dev = "mike deploy dev --push"
deploy-release = "mike deploy {args} latest --update-aliases --push"

[tool.pytest.ini_options]
addopts = [
  "--cov=pytvpaint",
  "--durations=5",
  "--failed-first",
  "--new-first",
  "--html=tests/reports/test_report.html",
  "--self-contained-html",
  "-vv",
  "--maxfail=1"
]
cache_dir = "tests/.pytest_cache"
log_cli = true
required_plugins = ["pytest-cov", "pytest-html"]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
ignore = ["E501", "UP006", "D107"]
extend-select = [
    "E",
    "I",
    "SLF001",
    "C901",
    "N",
    "UP",
    "RET",
    "SIM",
    "TID",
    "PTH",
    "ERA",
    "PERF",
    "RUF",
    "D",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
disallow_untyped_defs = true
exclude = "package.py"
follow_imports = "normal"
ignore_missing_imports = true
no_implicit_reexport = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
extra_checks = true
untyped_calls_exclude = "fileseq,websocket"